<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-FACE | Simple UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #070B14; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-600 rounded flex items-center justify-center font-bold text-white">AF</div>
            <h1 class="text-lg font-semibold">AURA<span class="text-cyan-400 font-bold text-sm px-2">BIOMETRIC</span></h1>
        </div>
        <div class="text-sm font-medium px-3 py-1 bg-emerald-900/50 text-emerald-400 border border-emerald-500/30 rounded-full">
            ● System Live
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left: Camera View -->
        <section class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-4 text-cyan-400">Live Scanner</h2>
            <div class="w-full aspect-video bg-black rounded-lg border border-slate-700 flex items-center justify-center relative">
                <!-- Mock Camera Feed Box -->
                <div class="w-48 h-48 border-2 border-cyan-500 rounded-lg flex flex-col justify-between p-2">
                    <div class="text-xs text-cyan-300 bg-black/50 px-1 rounded">Conf: 99%</div>
                    <div class="text-center text-sm font-bold bg-emerald-500/80 text-white rounded">EMP101</div>
                </div>
            </div>
            <div class="mt-4 flex gap-4">
                <button class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded text-sm font-bold text-white transition">Start Scan</button>
                <button class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-bold text-white transition">Stop</button>
            </div>
        </section>

        <!-- Right: Logs & Info -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col">
            <h2 class="text-lg font-semibold mb-4 text-cyan-400">Recent Logs</h2>
            
            <div class="flex-1 flex flex-col gap-3">
                <!-- Log Item -->
                <div class="p-3 bg-slate-800 rounded-lg border border-slate-700 flex justify-between items-center">
                    <div>
                        <div class="font-semibold text-sm">Harish Menariya</div>
                        <div class="text-xs text-slate-400">EMP101</div>
                    </div>
                    <div class="text-emerald-400 text-xs font-mono">09:02 AM</div>
                </div>

                <!-- Log Item -->
                <div class="p-3 bg-slate-800 rounded-lg border border-slate-700 flex justify-between items-center">
                    <div>
                        <div class="font-semibold text-sm">Dev Sharma</div>
                        <div class="text-xs text-slate-400">EMP004</div>
                    </div>
                    <div class="text-emerald-400 text-xs font-mono">09:05 AM</div>
                </div>
            </div>

            <!-- Admin Button -->
            <button class="mt-6 w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded text-sm font-semibold transition">
                Open Admin Portal
            </button>
        </section>

    </main>

</body>
</html>
